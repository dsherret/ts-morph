name: Publish
on:
  push:
    branches:
      - latest

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
    - uses: actions/checkout@v4
    - uses: denoland/setup-deno@v2
    - run: deno install
    - name: Build
      run: deno task build:deno
    - name: Publish
      run: cd deno && deno publish
