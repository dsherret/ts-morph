name: CI

on:
  pull_request:
  push:
    branches:
      - latest
    tags:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: denoland/setup-deno@v2
        with:
          cache: true
          deno-version: canary
      - uses: actions/setup-go@v6
        with:
          go-version-file: submodules/typescript-go/go.mod
          cache-dependency-path: submodules/typescript-go/go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
      - name: Build the tsgo compiler
        run: |
          cd submodules/typescript-go
          npm ci
          node _scripts/build-wasm.mjs
          cd _packages/native-preview
          npx tsc -b
      - name: Build
        run: |
          deno install
          deno task build
      - name: Type check
        run: |
          deno task -r ensure-no-project-compile-errors
      - name: Test
        run: |
          deno task -r test:ci
      - name: Code Verification
        run: |
          deno task -r code-verification

  jsr:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: denoland/setup-deno@v2
        with:
          cache: true
          deno-version: canary
      - uses: actions/setup-go@v6
        with:
          go-version-file: submodules/typescript-go/go.mod
          cache-dependency-path: submodules/typescript-go/go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
      - name: Build the tsgo compiler
        run: |
          cd submodules/typescript-go
          npm ci
          node _scripts/build-wasm.mjs
          cd _packages/native-preview
          npx tsc -b
      - run: deno install
      - name: Build
        run: deno task build:deno
      - name: Test
        run: cd deno && deno test --allow-read
      - name: Publish
        run: cd deno && deno publish --dry-run
