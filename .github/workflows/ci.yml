name: CI

on:
  pull_request:
  push:
    branches:
      - latest
    tags:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: denoland/setup-deno@v2
        with:
          cache: true
          deno-version: canary
      - uses: actions/setup-go@v6
        with:
          go-version-file: submodules/typescript-go/go.mod
          cache-dependency-path: submodules/typescript-go/go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
      - name: Build the tsgo compiler
        run: |
          cd submodules/typescript-go
          npm ci
          node _scripts/build-wasm.mjs
          cd _packages/native-preview
          npx tsc -b
      - name: Build
        run: |
          deno install
          deno task build
      - name: Type check
        run: |
          deno task -r ensure-no-project-compile-errors
      - name: Test
        run: |
          deno task -r test:ci
      - name: Code Verification
        run: |
          deno task -r code-verification
      - name: Browser
        # Two things this step needs come from the runner rather than from this
        # repository: the ubuntu image preinstalls Chrome, and the Deno installed
        # above provides `deno bundle`. Both are asserted here so that the day
        # either changes reads as that rather than as a browser test failure.
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          if [ ! -x "$CHROME_PATH" ]; then
            echo "::error::$CHROME_PATH is missing: the runner image no longer preinstalls Chrome. Install it in this step, or point CHROME_PATH at another Chromium."
            exit 1
          fi
          if ! deno bundle --help >/dev/null 2>&1; then
            echo "::error::\`deno bundle\` is unavailable in this Deno. Install one that has it, or bundle tsgo-wasm/browser/worker.ts another way."
            exit 1
          fi
          node tsgo-wasm/browser/run.mjs

  jsr:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: denoland/setup-deno@v2
        with:
          cache: true
          deno-version: canary
      - uses: actions/setup-go@v6
        with:
          go-version-file: submodules/typescript-go/go.mod
          cache-dependency-path: submodules/typescript-go/go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
      - name: Build the tsgo compiler
        run: |
          cd submodules/typescript-go
          npm ci
          node _scripts/build-wasm.mjs
          cd _packages/native-preview
          npx tsc -b
      - run: deno install
      - name: Build
        run: deno task build:deno
      - name: Test
        run: cd deno && deno test --allow-read
      - name: Publish
        run: cd deno && deno publish --dry-run
