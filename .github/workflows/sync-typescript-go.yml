name: Sync upstream typescript-go

on:
  schedule:
    - cron: '0 0 * * 0' # Weekly
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
          
      - name: Update submodule
        run: |
          git submodule update --remote packages/compiler-go-source
          
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: sync typescript-go submodule"
          title: "chore: Sync upstream typescript-go submodule"
          body: "Automated PR to sync the typescript-go submodule with the latest upstream changes."
          branch: "chore/sync-typescript-go"
