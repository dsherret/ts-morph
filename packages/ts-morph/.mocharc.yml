recursive: true
reporter: progress
timeout: 10000
spec: src/tests/**/*.ts
ignore:
  - src/tests/performance/**/*.ts
  # three files for capabilities that are not reachable: getEditsForRefactor and
  # JSDocFunctionType, which the Go compiler genuinely lacks, and type reference
  # directive resolution, which has no hook yet. they import exports that no longer
  # exist, which would abort the whole run at module load. kept in the tree as the
  # record of what was dropped; see that directory's README and
  # tsgo-wasm/BREAKING-CHANGES.md
  - src/tests/removed-capabilities/**/*.ts
